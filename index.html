<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kytes Tech | Cyberpunk Electronics</title>
    <style>
        :root {
            --bg-color: #0d0f12;
            --card-bg: #161b22;
            --accent-color: #00ff66;
            --text-color: #f0f6fc;
            --text-muted: #8b949e;
            --border-color: #30363d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding-bottom: 60px;
        }

        header {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.4rem;
            font-weight: bold;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .cart-icon {
            position: relative;
            cursor: pointer;
            font-size: 1.2rem;
        }

        .cart-badge {
            position: absolute;
            top: -8px;
            right: -10px;
            background-color: var(--accent-color);
            color: #000;
            font-weight: bold;
            font-size: 0.75rem;
            border-radius: 50%;
            padding: 2px 6px;
        }

        .container {
            max-width: 1100px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .hero {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .hero h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .hero p {
            color: var(--text-muted);
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1.5rem;
        }

        .product-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s, border-color 0.2s;
        }

        .product-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-color);
        }

        .product-image {
            width: 100%;
            height: 180px;
            background-color: #21262d;
            border-radius: 6px;
            object-fit: cover;
            margin-bottom: 1rem;
        }

        .product-title {
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
        }

        .product-price {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--accent-color);
            margin-bottom: 1rem;
        }

        .btn {
            background-color: var(--accent-color);
            color: #000;
            border: none;
            padding: 0.6rem 1rem;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            width: 90%;
            max-width: 500px;
            padding: 1.5rem;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.5rem;
            margin-bottom: 1rem;
        }

        .close-btn {
            cursor: pointer;
            font-size: 1.5rem;
            color: var(--text-muted);
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
            border-bottom: 1px solid #21262d;
            padding-bottom: 0.5rem;
        }

        .cart-total {
            font-size: 1.2rem;
            font-weight: bold;
            text-align: right;
            margin: 1rem 0;
        }

        #paypal-button-container {
            margin-top: 1rem;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Kytes Tech</div>
        <div class="cart-icon" onclick="toggleCart()">
            🛒 <span class="cart-badge" id="cart-count">0</span>
        </div>
    </header>

    <div class="container">
        <section class="hero">
            <h1>Next-Gen Electronics</h1>
            <p>High-performance gear curated for developers and tech enthusiasts.</p>
        </section>

        <main class="product-grid" id="product-grid">
            <!-- Dynamic products render here -->
        </main>
    </div>

    <!-- Cart Modal -->
    <div class="modal" id="cart-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Your Shopping Cart</h2>
                <span class="close-btn" onclick="toggleCart()">&times;</span>
            </div>
            <div id="cart-items"></div>
            <div class="cart-total" id="cart-total">Total: $0.00</div>
            <div id="paypal-button-container"></div>
        </div>
    </div>

    <script>
        const products = [
            { id: 1, name: "Cyberpunk Mechanical Keyboard", price: 129.99, image: "https://via.placeholder.com/250x180/161b22/00ff66?text=Keyboard" },
            { id: 2, name: "Ultra-Fast Wireless Mouse", price: 59.99, image: "https://via.placeholder.com/250x180/161b22/00ff66?text=Mouse" },
            { id: 3, name: "Noise-Canceling Headset", price: 199.99, image: "https://via.placeholder.com/250x180/161b22/00ff66?text=Headset" }
        ];

        let cart = [];

        function renderProducts() {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = products.map(product => `
                <div class="product-card">
                    <img src="${product.image}" alt="${product.name}" class="product-image">
                    <div>
                        <h3 class="product-title">${product.name}</h3>
                        <div class="product-price">$${product.price.toFixed(2)}</div>
                    </div>
                    <button class="btn" onclick="addToCart(${product.id})">Add to Cart</button>
                </div>
            `).join('');
        }

        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            cart.push(product);
            updateCart();
        }

        function updateCart() {
            document.getElementById('cart-count').innerText = cart.length;
            const itemsContainer = document.getElementById('cart-items');
            
            if (cart.length === 0) {
                itemsContainer.innerHTML = '<p>Your cart is empty.</p>';
                document.getElementById('cart-total').innerText = 'Total: $0.00';
                return;
            }

            itemsContainer.innerHTML = cart.map((item, index) => `
                <div class="cart-item">
                    <span>${item.name}</span>
                    <span>$${item.price.toFixed(2)}</span>
                </div>
            `).join('');

            const total = cart.reduce((sum, item) => sum + item.price, 0);
            document.getElementById('cart-total').innerText = `Total: $${total.toFixed(2)}`;
        }

        function toggleCart() {
            const modal = document.getElementById('cart-modal');
            modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
        }

        // Initialize storefront
        renderProducts();
    </script>
</body>
</html>
