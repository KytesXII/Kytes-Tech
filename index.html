<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kytes Tech | Store</title>
    <style>
        :root {
            --bg-color: #0d0f12;
            --card-bg: #161b22;
            --accent-color: #00ff66;
            --text-color: #f0f6fc;
            --border-color: #30363d;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); padding: 20px; }
        header { text-align: center; margin-bottom: 30px; }
        h1 { color: var(--accent-color); margin-bottom: 5px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; max-width: 1000px; margin: 0 auto; }
        .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; }
        .card img { width: 100%; height: 180px; object-fit: cover; }
        .card-body { padding: 15px; display: flex; flex-direction: column; flex-grow: 1; }
        .card-title { font-size: 1.1rem; margin-bottom: 8px; }
        .card-price { color: var(--accent-color); font-weight: bold; margin-bottom: 15px; font-size: 1.2rem; }
        .btn { padding: 10px; background: var(--accent-color); color: #000; font-weight: bold; border: none; border-radius: 4px; cursor: pointer; margin-top: auto; }
        footer { margin-top: 50px; text-align: center; opacity: 0.3; }
        footer a { color: var(--text-color); text-decoration: none; }
    </style>
</head>
<body>
    <header>
        <h1>Kytes Tech</h1>
        <p>Live Dynamic Catalog</p>
    </header>

    <div class="grid" id="productGrid">
        <p style="grid-column: 1/-1; text-align: center;">Loading products...</p>
    </div>

    <footer>
        <a href="admin.html">Admin</a>
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCGX7NceiCUn66xUR49PWui",
            authDomain: "kytes-tech.firebaseapp.com",
            projectId: "kytes-tech",
            storageBucket: "kytes-tech.firebasestorage.app",
            messagingSenderId: "494029206006",
            appId: "1:494029206006:web:05622cea5f",
            measurementId: "G-7BP92DZ51C"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function loadProducts() {
            const grid = document.getElementById("productGrid");
            try {
                const querySnapshot = await getDocs(collection(db, "products"));
                grid.innerHTML = "";
                if (querySnapshot.empty) {
                    grid.innerHTML = `<p style="grid-column: 1/-1; text-align: center;">No products available yet. Add some in the Admin panel!</p>`;
                    return;
                }
                querySnapshot.forEach((doc) => {
                    const item = doc.data();
                    grid.innerHTML += `
                        <div class="card">
                            <img src="${item.image}" alt="${item.name}">
                            <div class="card-body">
                                <div class="card-title">${item.name}</div>
                                <div class="card-price">$${item.price.toFixed(2)}</div>
                                <button class="btn">Buy Now</button>
                            </div>
                        </div>
                    `;
                });
            } catch (e) {
                grid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: red;">Error loading products: ${e.message}</p>`;
            }
        }

        loadProducts();
    </script>
</body>
</html>
