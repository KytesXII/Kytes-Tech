<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KYTES TECH // CYBERSTORE</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@500;600;700&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-obsidian: #07090e;
            --bg-card: #0e131f;
            --neon-green: #00ff87;
            --emerald: #22c55e;
            --border-glow: rgba(0, 255, 135, 0.25);
            --text-main: #e6edf3;
            --text-dim: #7d8590;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background-color: var(--bg-obsidian); 
            background-image: 
                linear-gradient(rgba(0, 255, 135, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 135, 0.03) 1px, transparent 1px);
            background-size: 32px 32px;
            color: var(--text-main); 
            font-family: 'Rajdhani', sans-serif; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
        }

        /* Cyber Header */
        header { 
            background: rgba(10, 14, 23, 0.9); 
            backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--border-glow); 
            padding: 16px 28px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }
        .brand { display: flex; align-items: center; gap: 12px; }
        .logo-svg { width: 38px; height: 38px; filter: drop-shadow(0 0 6px rgba(0, 255, 135, 0.6)); }
        .brand-title { font-family: 'Orbitron', sans-serif; font-size: 1.3rem; font-weight: 900; color: #fff; letter-spacing: 1px; }
        .brand-title span { color: var(--neon-green); }
        .tech-tag { font-family: 'Fira Code', monospace; font-size: 0.75rem; color: var(--neon-green); background: rgba(0, 255, 135, 0.1); border: 1px solid var(--border-glow); padding: 4px 8px; border-radius: 4px; }

        /* Hero Banner */
        .hero { text-align: center; padding: 45px 20px 20px; max-width: 800px; margin: 0 auto; }
        .badge { font-family: 'Fira Code', monospace; color: var(--neon-green); font-size: 0.8rem; letter-spacing: 2px; margin-bottom: 10px; display: block; }
        .hero h1 { font-family: 'Orbitron', sans-serif; font-size: 2.2rem; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; color: #fff; text-shadow: 0 0 15px rgba(0, 255, 135, 0.3); margin-bottom: 8px; }
        .hero p { color: var(--text-dim); font-size: 1.1rem; font-weight: 500; }

        /* Container & Grid */
        .container { max-width: 1100px; margin: 30px auto; padding: 0 20px; flex-grow: 1; width: 100%; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 24px; }

        /* Futuristic Cards */
        .card { 
            background: var(--bg-card); 
            border: 1px solid var(--border-glow); 
            border-radius: 8px; 
            overflow: hidden; 
            transition: all 0.25s ease; 
            display: flex; 
            flex-direction: column;
            position: relative;
        }
        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 2px;
            background: linear-gradient(90deg, transparent, var(--neon-green), transparent);
            opacity: 0;
            transition: opacity 0.25s ease;
        }
        .card:hover { 
            transform: translateY(-5px); 
            border-color: var(--neon-green); 
            box-shadow: 0 10px 30px rgba(0, 255, 135, 0.15); 
        }
        .card:hover::before { opacity: 1; }

        .card-img-wrap { width: 100%; height: 190px; background: #07090e; overflow: hidden; position: relative; }
        .card img { width: 100%; height: 100%; object-fit: cover; }
        .card-body { padding: 18px; display: flex; flex-direction: column; flex-grow: 1; }
        .card-title { font-family: 'Orbitron', sans-serif; font-size: 1rem; font-weight: 600; margin-bottom: 10px; color: #fff; }
        .card-price { font-family: 'Fira Code', monospace; color: var(--neon-green); font-size: 1.25rem; font-weight: 600; margin-bottom: 16px; text-shadow: 0 0 8px rgba(0, 255, 135, 0.4); }
        
        .btn-buy { 
            font-family: 'Orbitron', sans-serif; 
            font-size: 0.85rem; 
            padding: 12px; 
            background: var(--neon-green); 
            color: #000; 
            font-weight: 800; 
            border: none; 
            border-radius: 4px; 
            cursor: pointer; 
            transition: all 0.2s ease; 
            margin-top: auto; 
            text-transform: uppercase; 
            letter-spacing: 1px;
        }
        .btn-buy:hover { background: #00d670; box-shadow: 0 0 12px rgba(0, 255, 135, 0.5); }

        .state-msg { grid-column: 1/-1; text-align: center; padding: 60px 20px; font-family: 'Fira Code', monospace; color: var(--text-dim); }

        /* Cyber Footer */
        footer { border-top: 1px solid var(--border-glow); padding: 25px; text-align: center; font-family: 'Fira Code', monospace; font-size: 0.8rem; color: var(--text-dim); margin-top: 40px; }
        footer a { color: inherit; text-decoration: none; cursor: default; }
    </style>
</head>
<body>
    <header>
        <div class="brand">
            <svg class="logo-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="cyber-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#00ff87" />
                        <stop offset="100%" stop-color="#22c55e" />
                    </linearGradient>
                </defs>
                <polygon points="50,5 90,27 90,73 50,95 10,73 10,27" stroke="url(#cyber-grad)" stroke-width="4" fill="rgba(0, 255, 135, 0.05)" />
                <path d="M35 25V75M35 50L65 25M35 50L65 75" stroke="url(#cyber-grad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
                <circle cx="65" cy="25" r="4" fill="#00ff87" />
                <circle cx="65" cy="75" r="4" fill="#00ff87" />
            </svg>
            <div class="brand-title">KYTES <span>TECH</span></div>
        </div>
        <div class="tech-tag">// SYS.ONLINE</div>
    </header>

    <section class="hero">
        <span class="badge">// HARDWARE_SUPPLY</span>
        <h1>Cyberpunk Gear</h1>
        <p>Next-gen peripherals and modern tech gear</p>
    </section>

    <div class="container">
        <div class="grid" id="productGrid">
            <div class="state-msg">>[INITIALIZING_STORE_FEED]...</div>
        </div>
    </div>

    <footer>
        <p>© 2026 KYTES TECH <a href="admin.html">.</a> ALL RIGHTS RESERVED</p>
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCGX7NceiCUn66xUR49PWui",
            authDomain: "kytes-tech.firebaseapp.com",
            projectId: "kytes-tech",
            storageBucket: "kytes-tech.firebasestorage.app",
            messagingSenderId: "494029206006",
            appId: "1:494029206006:web:05622cea5f",
            measurementId: "G-7BP92DZ51C"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Real-time Firestore Feed
        onSnapshot(collection(db, "products"), (snapshot) => {
            const grid = document.getElementById("productGrid");
            grid.innerHTML = "";

            if (snapshot.empty) {
                grid.innerHTML = `<div class="state-msg">>[NO_INVENTORY_DETECTED]</div>`;
                return;
            }

            snapshot.forEach((docSnap) => {
                const item = docSnap.data();
                grid.innerHTML += `
                    <div class="card">
                        <div class="card-img-wrap">
                            <img src="${item.image}" alt="${item.name}">
                        </div>
                        <div class="card-body">
                            <div class="card-title">${item.name}</div>
                            <div class="card-price">$${Number(item.price).toFixed(2)}</div>
                            <button class="btn-buy">Acquire</button>
                        </div>
                    </div>
                `;
            });
        }, (error) => {
            document.getElementById("productGrid").innerHTML = `<div class="state-msg" style="color: #ff4d4d;">>[ERROR_LOADING_FEED]</div>`;
        });
    </script>
</body>
</html>
