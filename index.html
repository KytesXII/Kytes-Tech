<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KYTES TECH // AUDIO & ELECTRONICS</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-obsidian: #05070a;
            --plasma-green: #00e676;
            --plasma-cyan: #00f2fe;
            --text-main: #f0f4f8;
            --text-dim: #717f96;
            --card-bg: rgba(12, 17, 26, 0.75);
            --border-glow: rgba(0, 230, 118, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-obsidian);
            color: var(--text-main);
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(0, 242, 254, 0.08), transparent 70%),
                linear-gradient(rgba(0, 230, 118, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 230, 118, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
        }

        /* HEADER & BRANDING */
        header {
            background: rgba(5, 7, 10, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-glow);
            padding: 1rem 1.5rem;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .logo-svg {
            width: 38px;
            height: 38px;
            filter: drop-shadow(0 0 6px rgba(0, 230, 118, 0.6));
            animation: auraPulse 3s infinite alternate;
        }

        .brand-title {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 1.3rem;
            letter-spacing: 1.5px;
            color: #ffffff;
        }

        .brand-title span {
            color: var(--plasma-green);
            text-shadow: 0 0 8px var(--plasma-green);
        }

        .brand-subtitle {
            font-family: 'Fira Code', monospace;
            font-size: 0.65rem;
            color: var(--plasma-cyan);
            letter-spacing: 1px;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .lang-btn {
            background: transparent;
            border: 1px solid var(--plasma-cyan);
            color: var(--plasma-cyan);
            font-family: 'Fira Code', monospace;
            padding: 4px 8px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .lang-btn:hover {
            background: var(--plasma-cyan);
            color: var(--bg-obsidian);
            box-shadow: 0 0 10px var(--plasma-cyan);
        }

        .cart-trigger {
            background: rgba(0, 230, 118, 0.1);
            border: 1px solid var(--plasma-green);
            color: var(--plasma-green);
            font-family: 'Orbitron', sans-serif;
            padding: 6px 12px;
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s ease;
        }

        .cart-trigger:hover {
            background: var(--plasma-green);
            color: var(--bg-obsidian);
            box-shadow: 0 0 12px var(--plasma-green);
        }

        .cart-badge {
            background: var(--plasma-cyan);
            color: var(--bg-obsidian);
            font-family: 'Fira Code', monospace;
            font-weight: bold;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
        }

        /* CATEGORY FILTER CHIPS */
        .controls-bar {
            padding: 1.2rem 1.5rem 0.5rem;
            display: flex;
            gap: 10px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .controls-bar::-webkit-scrollbar {
            display: none;
        }

        .chip {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(113, 127, 150, 0.3);
            color: var(--text-dim);
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            padding: 8px 16px;
            white-space: nowrap;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .chip.active, .chip:hover {
            border-color: var(--plasma-green);
            color: var(--plasma-green);
            background: rgba(0, 230, 118, 0.08);
            box-shadow: 0 0 8px rgba(0, 230, 118, 0.2);
        }

        /* PRODUCT GRID & CARDS */
        .catalog-container {
            padding: 1.5rem;
            flex-grow: 1;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1.5rem;
        }

        .product-card {
            background: var(--card-bg);
            border: 1px solid rgba(113, 127, 150, 0.2);
            padding: 1rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            transition: 0.3s ease;
        }

        .product-card:hover {
            border-color: var(--plasma-cyan);
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(0, 242, 254, 0.15);
        }

        .product-image {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background: #000;
            margin-bottom: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .product-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            margin-bottom: 0.5rem;
            color: var(--text-main);
        }

        .product-category {
            font-family: 'Fira Code', monospace;
            font-size: 0.7rem;
            color: var(--text-dim);
            margin-bottom: 0.8rem;
            text-transform: uppercase;
        }

        .product-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 1rem;
            padding-top: 0.8rem;
            border-top: 1px dashed rgba(113, 127, 150, 0.2);
        }

        .product-price {
            font-family: 'Fira Code', monospace;
            font-size: 1.1rem;
            color: var(--plasma-green);
            font-weight: 600;
        }

        .add-cart-btn {
            background: transparent;
            border: 1px solid var(--plasma-green);
            color: var(--plasma-green);
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            padding: 6px 12px;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .add-cart-btn:hover {
            background: var(--plasma-green);
            color: var(--bg-obsidian);
        }

        /* CART DRAWER OVERLAY */
        .cart-drawer {
            position: fixed;
            top: 0;
            right: -400px;
            width: 100%;
            max-width: 380px;
            height: 100vh;
            background: #080c14;
            border-left: 1px solid var(--plasma-green);
            box-shadow: -10px 0 30px rgba(0, 0, 0, 0.8);
            z-index: 200;
            display: flex;
            flex-direction: column;
            transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .cart-drawer.open {
            right: 0;
        }

        .cart-header {
            padding: 1.2rem;
            border-bottom: 1px solid rgba(113, 127, 150, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cart-title {
            font-family: 'Orbitron', sans-serif;
            color: var(--plasma-cyan);
            font-size: 1rem;
        }

        .close-cart {
            background: none;
            border: none;
            color: var(--text-dim);
            font-size: 1.5rem;
            cursor: pointer;
        }

        .cart-body {
            flex-grow: 1;
            padding: 1.2rem;
            overflow-y: auto;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding-bottom: 0.8rem;
            border-bottom: 1px rgba(255, 255, 255, 0.05) solid;
        }

        .cart-item-details h4 {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            margin-bottom: 4px;
        }

        .cart-item-details p {
            font-family: 'Fira Code', monospace;
            font-size: 0.8rem;
            color: var(--plasma-green);
        }

        .remove-btn {
            background: none;
            border: none;
            color: #ff5252;
            cursor: pointer;
            font-size: 0.8rem;
            font-family: 'Fira Code', monospace;
        }

        .cart-footer {
            padding: 1.2rem;
            border-top: 1px solid rgba(113, 127, 150, 0.2);
            background: rgba(5, 7, 10, 0.8);
        }

        .cart-total {
            display: flex;
            justify-content: space-between;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            margin-bottom: 1rem;
        }

        .checkout-btn {
            width: 100%;
            background: var(--plasma-green);
            color: var(--bg-obsidian);
            border: none;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            padding: 12px;
            cursor: pointer;
            letter-spacing: 1px;
            transition: 0.2s ease;
        }

        .checkout-btn:hover {
            box-shadow: 0 0 15px var(--plasma-green);
            background: #00ff84;
        }

        /* FOOTER */
        footer {
            padding: 1.5rem;
            text-align: center;
            font-family: 'Fira Code', monospace;
            font-size: 0.75rem;
            color: var(--text-dim);
            border-top: 1px solid rgba(113, 127, 150, 0.1);
            margin-top: auto;
        }

        footer a {
            color: var(--text-dim);
            text-decoration: none;
        }

        /* ANIMATIONS */
        @keyframes auraPulse {
            0% { filter: drop-shadow(0 0 2px rgba(0, 230, 118, 0.4)); }
            100% { filter: drop-shadow(0 0 10px rgba(0, 242, 254, 0.8)); }
        }
    </style>
</head>
<body>

    <!-- BRAND HEADER (Unmovable English Brand Header) -->
    <header>
        <a href="#" class="brand-container">
            <svg class="logo-svg" viewBox="0 0 100 100">
                <defs>
                    <linearGradient id="plasmaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#00e676" />
                        <stop offset="50%" stop-color="#00f2fe" />
                        <stop offset="100%" stop-color="#ffffff" />
                    </linearGradient>
                </defs>
                <path d="M 20,10 L 40,10 L 40,40 L 70,10 L 95,10 L 55,50 L 95,90 L 70,90 L 40,60 L 40,90 L 20,90 Z" fill="url(#plasmaGrad)" />
            </svg>
            <div>
                <div class="brand-title">KYTES <span>TECH</span></div>
                <div class="brand-subtitle">// AUDIO & ELECTRONICS</div>
            </div>
        </a>

        <div class="nav-actions">
            <button class="lang-btn" onclick="toggleLanguage()" id="langToggle">[ES]</button>
            <button class="cart-trigger" onclick="toggleCart()">
                <span id="cartLabel">CART</span>
                <span class="cart-badge" id="cartBadge">0</span>
            </button>
        </div>
    </header>

    <!-- CATEGORY FILTERS -->
    <div class="controls-bar">
        <button class="chip active" onclick="filterCategory('ALL')" id="chip-all">ALL AUDIO</button>
        <button class="chip" onclick="filterCategory('SPEAKERS')" id="chip-speakers">SPEAKERS</button>
        <button class="chip" onclick="filterCategory('EARBUDS')" id="chip-earbuds">EARBUDS</button>
        <button class="chip" onclick="filterCategory('HEADPHONES')" id="chip-headphones">HEADPHONES</button>
        <button class="chip" onclick="filterCategory('ACCESSORIES')" id="chip-accessories">ACCESSORIES</button>
    </div>

    <!-- MAIN PRODUCT CATALOG -->
    <main class="catalog-container">
        <div class="product-grid" id="productGrid">
            <div style="font-family: 'Fira Code', monospace; color: var(--plasma-green);">
                >[INITIALIZING_CATALOG_FEED]...
            </div>
        </div>
    </main>

    <!-- SLIDE-OVER CART DRAWER -->
    <div class="cart-drawer" id="cartDrawer">
        <div class="cart-header">
            <div class="cart-title" id="cartDrawerTitle">// YOUR CART</div>
            <button class="close-cart" onclick="toggleCart()">&times;</button>
        </div>
        <div class="cart-body" id="cartItems">
            <p style="color: var(--text-dim); font-size: 0.9rem;" id="emptyCartText">Your cart is empty.</p>
        </div>
        <div class="cart-footer">
            <div class="cart-total">
                <span id="totalLabel">TOTAL:</span>
                <span id="cartTotalSum" style="color: var(--plasma-green);">$0.00</span>
            </div>
            <button class="checkout-btn" onclick="checkoutViaWhatsApp()" id="checkoutBtn">CHECKOUT VIA WHATSAPP</button>
        </div>
    </div>

    <!-- FOOTER -->
    <footer>
        <p>© 2026 KYTES TECH <a href="admin.html">.</a> <span id="rightsText">ALL RIGHTS RESERVED</span></p>
    </footer>

    <!-- FIREBASE SDK v10.8.0 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "",
            authDomain: "kytes-tech.firebaseapp.com",
            projectId: "kytes-tech",
            storageBucket: "kytes-tech.firebasestorage.app",
            messagingSenderId: "494029206006",
            appId: "1:494029206006:web:05622cea5f",
            measurementId: "G-7BP92DZ51C"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Global Products State
        window.allProducts = [];

        // Real-time Firestore Feed
        onSnapshot(collection(db, "products"), (snapshot) => {
            window.allProducts = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            renderProducts(window.allProducts);
        }, (error) => {
            console.error("Firestore Error:", error);
            document.getElementById("productGrid").innerHTML = `<p style="color:#ff5252; font-family:'Fira Code';">Failed to load catalog.</p>`;
        });
    </script>

    <!-- APP & I18N LOGIC -->
    <script>
        let currentLang = 'en';
        let cart = [];
        let activeCategory = 'ALL';

        // Auto-detect Spanish user preference on first load
        if (navigator.language && navigator.language.startsWith('es')) {
            currentLang = 'es';
            document.documentElement.lang = 'es';
        }

        const translations = {
            en: {
                cart: "CART",
                langBtn: "[ES]",
                chipAll: "ALL AUDIO",
                chipSpeakers: "SPEAKERS",
                chipEarbuds: "EARBUDS",
                chipHeadphones: "HEADPHONES",
                chipAccessories: "ACCESSORIES",
                cartTitle: "// YOUR CART",
                emptyCart: "Your cart is empty.",
                total: "TOTAL:",
                checkout: "CHECKOUT VIA WHATSAPP",
                rights: "ALL RIGHTS RESERVED",
                addCart: "+ ADD TO CART",
                waHeader: "Hello KYTES TECH! I would like to place an order:",
                waTotal: "Total:",
                waPrompt: "¿Is this available for delivery or pickup?"
            },
            es: {
                cart: "CARRITO",
                langBtn: "[EN]",
                chipAll: "TODO AUDIO",
                chipSpeakers: "BOCINAS",
                chipEarbuds: "AUDÍFONOS IN-EAR",
                chipHeadphones: "DIADEMAS",
                chipAccessories: "ACCESORIOS",
                cartTitle: "// TU CARRITO",
                emptyCart: "Tu carrito está vacío.",
                total: "TOTAL:",
                checkout: "COMPRAR POR WHATSAPP",
                rights: "TODOS LOS DERECHOS RESERVADOS",
                addCart: "+ AGREGAR",
                waHeader: "¡Hola KYTES TECH! Me gustaría realizar un pedido:",
                waTotal: "Total:",
                waPrompt: "¿Tienen disponibilidad para entrega local o envío?"
            }
        };

        function applyTranslations() {
            const t = translations[currentLang];
            document.documentElement.lang = currentLang;
            document.getElementById("cartLabel").innerText = t.cart;
            document.getElementById("langToggle").innerText = t.langBtn;
            document.getElementById("chip-all").innerText = t.chipAll;
            document.getElementById("chip-speakers").innerText = t.chipSpeakers;
            document.getElementById("chip-earbuds").innerText = t.chipEarbuds;
            document.getElementById("chip-headphones").innerText = t.chipHeadphones;
            document.getElementById("chip-accessories").innerText = t.chipAccessories;
            document.getElementById("cartDrawerTitle").innerText = t.cartTitle;
            document.getElementById("emptyCartText").innerText = t.emptyCart;
            document.getElementById("totalLabel").innerText = t.total;
            document.getElementById("checkoutBtn").innerText = t.checkout;
            document.getElementById("rightsText").innerText = t.rights;

            if (window.allProducts) {
                renderProducts(window.allProducts);
            }
        }

        function toggleLanguage() {
            currentLang = currentLang === 'en' ? 'es' : 'en';
            applyTranslations();
        }

        function filterCategory(cat) {
            activeCategory = cat;
            document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            event.target.classList.add('active');
            
            if (!window.allProducts) return;

            if (cat === 'ALL') {
                renderProducts(window.allProducts);
            } else if (cat === 'ACCESSORIES') {
                const keywords = ['case', 'cable', 'charger', 'adapter', 'strap', 'funda', 'cargador'];
                const filtered = window.allProducts.filter(p => 
                    p.category === 'ACCESSORIES' || 
                    keywords.some(kw => p.name.toLowerCase().includes(kw))
                );
                renderProducts(filtered);
            } else {
                const filtered = window.allProducts.filter(p => p.category === cat);
                renderProducts(filtered);
            }
        }

        function renderProducts(products) {
            const grid = document.getElementById("productGrid");
            const t = translations[currentLang];

            if (products.length === 0) {
                grid.innerHTML = `<p style="color: var(--text-dim); font-family: 'Fira Code';">No products found in this category.</p>`;
                return;
            }

            grid.innerHTML = products.map(p => `
                <div class="product-card">
                    <img src="${p.image || 'https://via.placeholder.com/300/05070a/00e676?text=KYTES+TECH'}" alt="${p.name}" class="product-image">
                    <div>
                        <div class="product-category">// ${p.category || 'TECH'}</div>
                        <h3 class="product-title">${p.name}</h3>
                    </div>
                    <div class="product-footer">
                        <div class="product-price">$${parseFloat(p.price).toFixed(2)}</div>
                        <button class="add-cart-btn" onclick="addToCart('${p.id}')">${t.addCart}</button>
                    </div>
                </div>
            `).join('');
        }

        function addToCart(productId) {
            const product = window.allProducts.find(p => p.id === productId);
            if (!product) return;

            const existing = cart.find(item => item.id === productId);
            if (existing) {
                existing.qty += 1;
            } else {
                cart.push({ ...product, qty: 1 });
            }

            updateCartUI();
        }

        function removeFromCart(productId) {
            cart = cart.filter(item => item.id !== productId);
            updateCartUI();
        }

        function updateCartUI() {
            const cartItemsContainer = document.getElementById("cartItems");
            const cartBadge = document.getElementById("cartBadge");
            const cartTotalSum = document.getElementById("cartTotalSum");
            const t = translations[currentLang];

            const totalItems = cart.reduce((sum, item) => sum + item.qty, 0);
            cartBadge.innerText = totalItems;

            if (cart.length === 0) {
                cartItemsContainer.innerHTML = `<p style="color: var(--text-dim); font-size: 0.9rem;" id="emptyCartText">${t.emptyCart}</p>`;
                cartTotalSum.innerText = "$0.00";
                return;
            }

            let totalSum = 0;
            cartItemsContainer.innerHTML = cart.map(item => {
                const itemTotal = item.price * item.qty;
                totalSum += itemTotal;
                return `
                    <div class="cart-item">
                        <div class="cart-item-details">
                            <h4>${item.name} (x${item.qty})</h4>
                            <p>$${itemTotal.toFixed(2)}</p>
                        </div>
                        <button class="remove-btn" onclick="removeFromCart('${item.id}')">[REMOVE]</button>
                    </div>
                `;
            }).join('');

            cartTotalSum.innerText = `$${totalSum.toFixed(2)}`;
        }

        function toggleCart() {
            document.getElementById("cartDrawer").classList.toggle("open");
        }

        // DYNAMIC WHATSAPP CHECKOUT GATEWAY
        function checkoutViaWhatsApp() {
            if (cart.length === 0) return;

            const t = translations[currentLang];
            const phoneNumber = "528995292924"; // Target phone number with Mexico country code

            let orderItems = "";
            let totalSum = 0;

            cart.forEach(item => {
                const itemTotal = item.price * item.qty;
                totalSum += itemTotal;
                orderItems += `• ${item.name} (x${item.qty}) - $${itemTotal.toFixed(2)} MXN\n`;
            });

            const message = `${t.waHeader}\n\n${orderItems}\n${t.waTotal} $${totalSum.toFixed(2)} MXN\n\n${t.waPrompt}`;
            const encodedMsg = encodeURIComponent(message);

            window.open(`https://wa.me/${phoneNumber}?text=${encodedMsg}`, '_blank');
        }

        // Initialize translations on load
        window.addEventListener('DOMContentLoaded', () => {
            applyTranslations();
        });
    </script>
</body>
</html>
