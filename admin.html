<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kytes Tech | Admin Dashboard</title>
    <style>
        :root {
            --bg-color: #0d0f12;
            --card-bg: #161b22;
            --accent-color: #00ff66;
            --danger-color: #ff4d4d;
            --text-color: #f0f6fc;
            --border-color: #30363d;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); padding: 20px; max-width: 600px; margin: 0 auto; }
        h1, h2 { color: var(--accent-color); text-align: center; margin-bottom: 20px; }
        .form-card, .list-card { background: var(--card-bg); border: 1px solid var(--border-color); padding: 20px; border-radius: 8px; margin-bottom: 30px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 0.9rem; }
        input { width: 100%; padding: 10px; border-radius: 4px; border: 1px solid var(--border-color); background: #0d1117; color: var(--text-color); }
        .btn { width: 100%; padding: 12px; background: var(--accent-color); color: #000; font-weight: bold; border: none; border-radius: 4px; cursor: pointer; }
        .btn-delete { background: var(--danger-color); color: #fff; padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .product-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border-color); }
        .product-item:last-child { border-bottom: none; }
        .product-info { display: flex; align-items: center; gap: 10px; }
        .product-info img { width: 40px; height: 40px; object-fit: cover; border-radius: 4px; }
        #status { text-align: center; margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Admin Panel</h1>
    
    <div class="form-card">
        <form id="productForm">
            <div class="form-group">
                <label>Product Name</label>
                <input type="text" id="name" required placeholder="e.g. Wireless Mouse">
            </div>
            <div class="form-group">
                <label>Price ($)</label>
                <input type="number" step="0.01" id="price" required placeholder="29.99">
            </div>
            <div class="form-group">
                <label>Image URL</label>
                <input type="url" id="image" required placeholder="https://example.com/image.jpg">
            </div>
            <button type="submit" class="btn">Save to Store</button>
        </form>
        <div id="status"></div>
    </div>

    <h2>Manage Products</h2>
    <div class="list-card" id="adminProductList">
        <p style="text-align: center;">Loading inventory...</p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCGX7NceiCUn66xUR49PWui",
            authDomain: "kytes-tech.firebaseapp.com",
            projectId: "kytes-tech",
            storageBucket: "kytes-tech.firebasestorage.app",
            messagingSenderId: "494029206006",
            appId: "1:494029206006:web:05622cea5f",
            measurementId: "G-7BP92DZ51C"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Add Product
        document.getElementById("productForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const status = document.getElementById("status");
            status.style.color = "#00ff66";
            status.innerText = "Saving...";

            try {
                await addDoc(collection(db, "products"), {
                    name: document.getElementById("name").value,
                    price: parseFloat(document.getElementById("price").value),
                    image: document.getElementById("image").value
                });
                status.innerText = "Product added successfully!";
                document.getElementById("productForm").reset();
            } catch (err) {
                status.style.color = "red";
                status.innerText = "Error saving product.";
            }
        });

        // Real-time Product Listing & Deletion
        onSnapshot(collection(db, "products"), (snapshot) => {
            const listContainer = document.getElementById("adminProductList");
            listContainer.innerHTML = "";

            if (snapshot.empty) {
                listContainer.innerHTML = `<p style="text-align: center;">No items in database.</p>`;
                return;
            }

            snapshot.forEach((docSnap) => {
                const item = docSnap.data();
                const itemDiv = document.createElement("div");
                itemDiv.className = "product-item";
                itemDiv.innerHTML = `
                    <div class="product-info">
                        <img src="${item.image}" alt="${item.name}">
                        <div>
                            <div><strong>${item.name}</strong></div>
                            <div style="color: var(--accent-color); font-size: 0.9rem;">$${item.price.toFixed(2)}</div>
                        </div>
                    </div>
                    <button class="btn-delete" data-id="${docSnap.id}">Delete</button>
                `;
                listContainer.appendChild(itemDiv);
            });

            // Attach Delete Listeners
            document.querySelectorAll(".btn-delete").forEach(button => {
                button.addEventListener("click", async (e) => {
                    const id = e.target.getAttribute("data-id");
                    if (confirm("Are you sure you want to delete this item?")) {
                        await deleteDoc(doc(db, "products", id));
                    }
                });
            });
        });
    </script>
</body>
</html>
