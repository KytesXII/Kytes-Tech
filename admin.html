<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kytes Tech | Admin Dashboard</title>
    <style>
        :root {
            --bg-color: #0d0f12;
            --card-bg: #161b22;
            --accent-color: #00ff66;
            --text-color: #f0f6fc;
            --border-color: #30363d;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: var(--card-bg); padding: 20px; border-radius: 8px; border: 1px solid var(--border-color); }
        h2 { color: var(--accent-color); margin-bottom: 20px; text-align: center; }
        input { width: 100%; padding: 10px; margin-bottom: 12px; background: #0d0f12; border: 1px solid var(--border-color); color: #fff; border-radius: 4px; }
        button { width: 100%; padding: 12px; background: var(--accent-color); color: #000; font-weight: bold; border: none; border-radius: 4px; cursor: pointer; }
        .status { margin-top: 15px; text-align: center; color: var(--accent-color); }
    </style>
</head>
<body>
    <div class="container">
        <h2>Add New Product</h2>
        <input type="text" id="pName" placeholder="Product Name">
        <input type="number" id="pPrice" placeholder="Price ($)" step="0.01">
        <input type="text" id="pImage" placeholder="Image URL (Unsplash/Direct Link)">
        <button onclick="addProduct()">Save to Store</button>
        <div id="status" class="status"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCGX7NceiCUn66xUR49PWui",
            authDomain: "kytes-tech.firebaseapp.com",
            projectId: "kytes-tech",
            storageBucket: "kytes-tech.firebasestorage.app",
            messagingSenderId: "494029206006",
            appId: "1:494029206006:web:05622cea5f",
            measurementId: "G-7BP92DZ51C"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.addProduct = async function() {
            const name = document.getElementById("pName").value;
            const price = parseFloat(document.getElementById("pPrice").value);
            const image = document.getElementById("pImage").value;
            const status = document.getElementById("status");

            if (!name || !price || !image) {
                status.innerText = "Please fill in all fields.";
                return;
            }

            try {
                await addDoc(collection(db, "products"), { name, price, image, createdAt: new Date() });
                status.innerText = "Product added successfully!";
                document.getElementById("pName").value = "";
                document.getElementById("pPrice").value = "";
                document.getElementById("pImage").value = "";
            } catch (e) {
                status.innerText = "Error adding product: " + e.message;
            }
        };
    </script>
</body>
</html>
